# Jellyfin Android Client Build Workflow
name: Build Jellyfin Android Client

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug
      
    - name: Build Release APK
      run: ./gradlew assembleRelease
      
    - name: Sign Release APK
      if: github.ref == 'refs/heads/main'
      run: |
        # Create keystore if it doesn't exist
        if [ ! -f "jellyfin-release-keystore.jks" ]; then
          keytool -genkey -v -keystore jellyfin-release-keystore.jks \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias jellyfin-release-key \
            -dname "CN=Jellyfin, OU=Jellyfin, O=Jellyfin, L=Unknown, ST=Unknown, C=Unknown"
        fi
        ./gradlew assembleRelease
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: jellyfin-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: jellyfin-release-apk
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
        
    - name: Generate Release Notes
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Release Notes for Jellyfin Android Client" > release-notes.md
        echo "=========================================" >> release-notes.md
        echo "" >> release-notes.md
        echo "## Build Information" >> release-notes.md
        echo "- Version: ${{ github.sha }}" >> release-notes.md
        echo "- Branch: ${{ github.ref }}" >> release-notes.md
        echo "- Build Date: $(date)" >> release-notes.md
        
    - name: Publish Release (if tagged)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "Publishing release for tag ${{ github.ref }}"
        # This would be implemented in a real workflow to publish to GitHub releases