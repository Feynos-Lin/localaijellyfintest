# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmOptions="-Xmx2g"

# Build Features
android.buildFeatures.viewBinding=true
android.buildFeatures.compose=true
android.compose.compiler.reportPerformanceMetrics=true

# Enable R8 full mode for release builds
android.enableR8.fullMode=true

# Disable build features that aren't needed
android.suppressUnsupportedCompileSdk=34

# Gradle Enterprise
# org.gradle.enterprise.capturegradleconfiguration=true

# Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true

# JVM target for Kotlin
kotlin.jvmTarget=17

# Enable incremental compilation
kotlin.incremental=true

# Enable KSP (Kotlin Symbol Processing)
ksp.incremental=true

# Enable AndroidX Compose
android.nonTransitiveRClass=true
android.useAndroidX=true

# Enable build cache
org.gradle.buildCache.enabled=true